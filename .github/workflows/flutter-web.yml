name: Flutter Web Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build Flutter Web
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format .
      - name: Analyze
        # Existing informational lint suggestions remain visible without blocking tests/build.
        # Analyzer errors and warnings still fail the workflow.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookidea-web
          path: build/web
          if-no-files-found: error

